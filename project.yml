name: Tortu
options:
  bundleIdPrefix: com.muhammedsalihkaragoz
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_IDENTITY: "Developer ID Application"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: TW3M4N5Q8D
    OTHER_CODE_SIGN_FLAGS: "--timestamp"
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  ScanCore:
    path: Packages/ScanCore
  RulesEngine:
    path: Packages/RulesEngine
  SafetyKit:
    path: Packages/SafetyKit
  CleanerKit:
    path: Packages/CleanerKit
  HelperProtocol:
    path: Packages/HelperProtocol
  Entitlements:
    path: Packages/Entitlements
  HistoryKit:
    path: Packages/HistoryKit
  FindersKit:
    path: Packages/FindersKit
  MonitorKit:
    path: Packages/MonitorKit

targets:
  Tortu:
    type: application
    platform: macOS
    sources:
      - path: Tortu
      - path: TortuHelper/com.muhammedsalihkaragoz.tortu.helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    dependencies:
      - target: TortuHelper
        embed: true
        copy:
          destination: executables
      - package: ScanCore
      - package: RulesEngine
      - package: SafetyKit
      - package: CleanerKit
      - package: HelperProtocol
      - package: Entitlements
      - package: HistoryKit
      - package: FindersKit
      - package: MonitorKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.muhammedsalihkaragoz.tortu
        PRODUCT_NAME: Tortu
        INFOPLIST_FILE: Tortu/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tortu/Tortu.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
    scheme:
      testTargets: []

  TortuHelper:
    type: tool
    platform: macOS
    sources:
      - path: TortuHelper
        excludes: ["*.plist"]
    dependencies:
      - package: HelperProtocol
      - package: RulesEngine
      - package: SafetyKit
      - package: ScanCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.muhammedsalihkaragoz.tortu.helper
        PRODUCT_NAME: TortuHelper
        # A command-line tool has no Info.plist file, so the identifier has to
        # be embedded in the binary. SMAppService matches the launchd label
        # against it, and the app's XPC requirement names it.
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        # The helper is embedded in the app bundle, never installed on its
        # own. Giving it an INSTALL_PATH makes xcodebuild try to archive it as
        # a separate product, which fails because a command-line tool has no
        # bundle identifier of its own.
        SKIP_INSTALL: YES
