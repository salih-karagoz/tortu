name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Test packages
        # The packages carry the logic and need no signing identity, so this
        # runs on any machine. Building the app does not: it needs the
        # Developer ID certificate, which is not available to pull requests.
        run: |
          for package in Packages/*/; do
            echo "::group::$(basename "$package")"
            (cd "$package" && swift test)
            echo "::endgroup::"
          done

  build:
    runs-on: macos-15
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build unsigned
        # Signing and notarisation happen on a machine that holds the
        # certificate. CI only proves the app still compiles.
        run: |
          xcodebuild -project Tortu.xcodeproj -scheme Tortu \
            -configuration Debug -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" OTHER_CODE_SIGN_FLAGS="" \
            build
